name: Compile userscript

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: # allow manual re-runs (e.g. rebuild a release without a version bump)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for the draft-release step (softprops/action-gh-release)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify dist artifacts
        run: |
          test -f dist/ASF-STM.user.js
          test -f dist/ASF-STM.debug.js
          ! grep -RF '{{' dist/ || (echo 'Unreplaced placeholder in dist/' && exit 1)
      - name: Get previous commit hash
        run: echo "PREVIOUS_COMMIT_HASH=$(git rev-parse HEAD^)" >> $GITHUB_ENV
      - name: Set env
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          LATEST_RELEASE_VERSION=$(git show $PREVIOUS_COMMIT_HASH:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "0.0")
          if [ -z "$LATEST_RELEASE_VERSION" ]; then
            LATEST_RELEASE_VERSION="0.0"
          fi
          echo "LATEST_RELEASE_VERSION=$LATEST_RELEASE_VERSION" >> $GITHUB_ENV
          if ! printf '%s\n' "$VERSION" "$LATEST_RELEASE_VERSION" | sort -C -V; then
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          fi
      - name: Get commit history
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        run: |
          COMMIT_LOG=$(git log -n 20 --pretty=format:"- %h - %as: %s")
          CURRENT_COMMIT_VERSION=$LATEST_RELEASE_VERSION
          while IFS= read -r COMMIT; do
            COMMIT_SHA=$(echo $COMMIT | cut -c3-9)
            COMMIT_VERSION=$(git show $COMMIT_SHA:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "0.0")
            if [ "$CURRENT_COMMIT_VERSION" != "$COMMIT_VERSION" ]; then
              CURRENT_COMMIT_VERSION=$COMMIT_VERSION
              echo "# $CURRENT_COMMIT_VERSION"  >> commit_history.md
            fi
            echo $COMMIT >> commit_history.md
            if ! printf '%s\n' "$LATEST_RELEASE_VERSION" "$COMMIT_VERSION" | sort -C -V; then
              break
            fi
          done <<< "$COMMIT_LOG"
      - name: Draft release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          body_path: commit_history.md
          draft: true
          files: |
            dist/ASF-STM.user.js
            dist/ASF-STM.debug.js
          name: ASF-STM-Enhancement V${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
