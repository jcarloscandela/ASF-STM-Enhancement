name: Compile userscript

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch: # allow manual re-runs (e.g. rebuild a release without a version bump)

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # required for the draft-release step (softprops/action-gh-release)
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm typecheck
      - name: Lint
        run: pnpm lint
      - name: Run unit tests
        run: pnpm test
      - name: Build
        run: pnpm build
      - name: Verify dist artifacts
        run: |
          test -f dist/ASF-STM.user.js
          ! grep -RF '{{' dist/ || (echo 'Unreplaced placeholder in dist/' && exit 1)
          ! grep -RF '// DEBUG' dist/ || (echo 'Debug marker left in dist/' && exit 1)
          DIST_BYTES=$(wc -c < dist/ASF-STM.user.js)
          echo "dist/ASF-STM.user.js: ${DIST_BYTES} B (budget 6000000 B)"
          test "$DIST_BYTES" -le 6000000 || (echo "dist exceeds 6000000 B budget" && exit 1)
      - name: Set release env
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          HEAD_COMMIT_VERSION=$(git show HEAD^:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "0.0")
          if ! printf '%s\n' "$VERSION" "$HEAD_COMMIT_VERSION" | sort -C -V; then
            echo "SHOULD_RELEASE=true" >> $GITHUB_ENV
          fi
      - name: Get commit history
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        run: |
          COMMIT_LOG=$(git log -n 20 --pretty=format:"- %h - %as: %s")
          echo "# $VERSION" >> commit_history.md
          while IFS= read -r COMMIT; do
            COMMIT_SHA=$(echo $COMMIT | cut -c3-9)
            COMMIT_VERSION=$(git show $COMMIT_SHA:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).version" 2>/dev/null || echo "0.0")
            if [ "$COMMIT_VERSION" != "$VERSION" ]; then
              break
            fi
            echo $COMMIT >> commit_history.md
          done <<< "$COMMIT_LOG"
      - name: Draft release
        if: ${{ env.SHOULD_RELEASE == 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          body_path: commit_history.md
          draft: true
          files: |
            dist/ASF-STM.user.js
          name: ASF-STM-Enhancement V${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
